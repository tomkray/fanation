<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Não É Um Fã: comenta o @ do seu ídolo no Instagram e ganha casa na cidade 3D. Ranking global, $NEFA e vibe de quem joga junto — @naoeumfa."
    />
    <title>Não É Um Fã · a cidade de quem joga junto</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/naoeumfa-mark-512.png" />
    <link rel="preload" as="image" href="/brand/naoeumfa-mark.svg" />
    <style>
      /* Painted before any script runs, so the first frame is always the brand. */
      html,
      body {
        margin: 0;
        background: #000;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, #0b1430 0%, #04060f 62%, #000 100%);
        transition: opacity 360ms ease, visibility 360ms ease;
      }
      .boot--done {
        opacity: 0;
        visibility: hidden;
      }
      .boot__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .boot__halo {
        position: relative;
        width: 112px;
        height: 112px;
        animation: boot-bob 2.4s ease-in-out infinite;
      }
      .boot__halo::before,
      .boot__halo::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px solid rgba(41, 151, 255, 0.55);
        animation: boot-ring 2.4s ease-out infinite;
      }
      .boot__halo::after {
        animation-delay: 1.2s;
      }
      .boot__mark {
        position: relative;
        display: block;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 16px 48px rgba(10, 132, 255, 0.28);
      }
      .boot__mark img {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* A glint sweeps across the pixel sunglasses. */
      .boot__mark::after {
        content: '';
        position: absolute;
        top: 36%;
        left: -60%;
        width: 40%;
        height: 16%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        transform: skewX(-20deg);
        animation: boot-glint 2.4s ease-in-out infinite;
      }
      .boot__word {
        font: 600 18px/1 -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
        letter-spacing: -0.35px;
        color: #f5f5f7;
      }
      .boot__word span {
        color: #c7c7cc;
        font-weight: 400;
      }
      .boot__dots {
        display: flex;
        gap: 8px;
      }
      .boot__dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2997ff;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot__dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .boot__dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes boot-ring {
        0% { transform: scale(0.92); opacity: 0.9; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      @keyframes boot-glint {
        0%, 45% { left: -60%; }
        75%, 100% { left: 130%; }
      }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__halo,
        .boot__halo::before,
        .boot__halo::after,
        .boot__mark::after,
        .boot__dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-label="Carregando a cidade">
      <div class="boot__stack">
        <div class="boot__halo">
          <div class="boot__mark"><img src="/brand/naoeumfa-mark.svg" width="112" height="112" alt="" /></div>
        </div>
        <div class="boot__word">naoeumfa<span>.com</span></div>
        <div class="boot__dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/presentation/main.tsx"></script>
  </body>
</html>
